<!DOCTYPE html>
<html>
<head>
    <title>Decrypt Message</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin: 20px 0; }
        input[type="password"], textarea { width: 100%; padding: 10px; margin: 5px 0; }
        button { padding: 10px 20px; background: #007cba; color: white; border: none; cursor: pointer; }
        button:hover { background: #005a85; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
        #decryptedContent { border: 1px solid #ccc; padding: 20px; margin: 20px 0; min-height: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Decrypt Secret Message</h1>
        
        <div class="form-group">
            <label>Encrypted Message (Base64):</label>
            <textarea id="encryptedData" rows="10" placeholder="Paste the encrypted base64 data here..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter the shared password">
        </div>
        
        <button onclick="decryptMessage()">Decrypt Message</button>
        
        <div id="status"></div>
        
        <h2>Decrypted Content:</h2>
        <div id="decryptedContent"></div>
    </div>

    <script>
        // Convert hex string to ArrayBuffer
        function hexToArrayBuffer(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
            }
            return bytes.buffer;
        }

        // Convert base64 to ArrayBuffer
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Extract salt and ciphertext from OpenSSL format
        function extractSaltAndData(encryptedData) {
            const data = new Uint8Array(encryptedData);
            
            // Check for "Salted__" header (8 bytes)
            const saltedHeader = "Salted__";
            const headerBytes = new TextEncoder().encode(saltedHeader);
            
            // Verify the header exists
            for (let i = 0; i < headerBytes.length; i++) {
                if (data[i] !== headerBytes[i]) {
                    throw new Error("Invalid OpenSSL format - missing 'Salted__' header");
                }
            }
            
            // Extract salt (bytes 8-15)
            const salt = data.slice(8, 16);
            
            // Extract actual encrypted data (everything after byte 16)
            const ciphertext = data.slice(16);
            
            return { salt, ciphertext };
        }

        // Derive key from password and salt using PBKDF2
        async function deriveKey(password, salt, iterations = 10000) {
            // Import password as key material
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveBits']
            );

            // Derive bits using PBKDF2
            const derivedBits = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    hash: 'SHA-256',
                    salt: salt,
                    iterations: iterations
                },
                keyMaterial,
                256 // 256 bits for AES-256
            );

            // Import the derived bits as an AES-CBC key
            return await crypto.subtle.importKey(
                'raw',
                derivedBits,
                { name: 'AES-CBC' },
                false,
                ['decrypt']
            );
        }

        // Main decryption function
        async function decryptMessage() {
            const encryptedBase64 = document.getElementById('encryptedData').value.trim();
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');
            const contentDiv = document.getElementById('decryptedContent');
            
            if (!encryptedBase64 || !password) {
                statusDiv.innerHTML = '<div class="error">Please provide both encrypted data and password.</div>';
                return;
            }

            try {
                statusDiv.innerHTML = '<div>Decrypting...</div>';
                
                // Convert base64 to ArrayBuffer
                const encryptedData = base64ToArrayBuffer(encryptedBase64);
                
                // Extract salt and ciphertext
                const { salt, ciphertext } = extractSaltAndData(encryptedData);
                
                console.log('Salt extracted:', Array.from(salt).map(b => b.toString(16).padStart(2, '0')).join(''));
                
                // Derive key from password and salt
                const key = await deriveKey(password, salt);
                
                // OpenSSL uses MD5 to derive the IV from key and password (simplified approach)
                // For this example, we'll extract the IV from the first 16 bytes of a second derivation
                const ivMaterial = await crypto.subtle.importKey(
                    'raw',
                    new TextEncoder().encode(password + 'iv'),
                    { name: 'PBKDF2' },
                    false,
                    ['deriveBits']
                );
                
                const ivBits = await crypto.subtle.deriveBits(
                    {
                        name: 'PBKDF2',
                        hash: 'SHA-256',
                        salt: salt,
                        iterations: 1
                    },
                    ivMaterial,
                    128 // 128 bits for IV
                );
                
                const iv = new Uint8Array(ivBits);
                
                // Decrypt the data
                const decrypted = await crypto.subtle.decrypt(
                    {
                        name: 'AES-CBC',
                        iv: iv
                    },
                    key,
                    ciphertext
                );
                
                // Convert decrypted ArrayBuffer to string
                const decryptedText = new TextDecoder().decode(decrypted);
                
                statusDiv.innerHTML = '<div class="success">Decryption successful!</div>';
                
                // Display decrypted content as HTML
                contentDiv.innerHTML = decryptedText;
                
            } catch (error) {
                console.error('Decryption failed:', error);
                statusDiv.innerHTML = '<div class="error">Decryption failed. Please check your password and encrypted data.</div>';
                contentDiv.innerHTML = '';
            }
        }

        // Allow Enter key to trigger decryption
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                decryptMessage();
            }
        });
    </script>
</body>
</html>
